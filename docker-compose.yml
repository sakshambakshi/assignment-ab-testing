version: '3.8'

services:
  # Development Environment
  api-dev:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ab-testing-dev
    ports:
      - "${PORT:-8080}:8080"
    volumes:
      - ./src:/app/src
      - ./.env:/app/.env
    # Override the default command to use hot-reloading
    command: npm run dev
    environment:
      - NODE_ENV=development
    env_file:
      - .env

  # Production Environment (for testing production locally)
  api-prod:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ab-testing-prod
    ports:
      - "8080:8080"
    environment:
      - NODE_ENV=production
    env_file:
      - .env
    command: npm start  